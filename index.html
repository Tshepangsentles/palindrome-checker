<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Palindrome Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Palindrome Checker</h1>
    <p class="hint">A palindrome reads the same backwards and forwards, e.g. racecar, level, dad.</p>

    <div class="input-row">
      <input type="text" id="word-input" placeholder="Type a word or phrase" autocomplete="off" />
      <button id="check-btn">Check</button>
    </div>

    <p id="result" class="result" aria-live="polite"></p>

    <section>
      <div class="history-header">
        <h2>Previously checked</h2>
        <button id="clear-btn" class="secondary">Clear</button>
      </div>
      <ul id="history"></ul>
      <p id="empty" class="empty">No words checked yet.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
